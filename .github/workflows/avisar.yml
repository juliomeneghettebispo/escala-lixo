name: Aviso Retirada de Lixo

on:
  schedule:
    - cron: '0 9 * * 1-5' # 6h horario de Brasilia (UTC-3), segunda a sexta
  workflow_dispatch:
    inputs:
      confirmar_envio:
        description: 'Digite ENVIAR para confirmar o envio real de e-mails (em branco = modo teste, nenhum e-mail e enviado)'
        required: false
        default: ''

# Garante que duas execucoes (ex.: agendada + manual) nunca rodem ao mesmo
# tempo: a segunda espera a primeira terminar antes de checar/registrar o
# controle de envio do dia, evitando corrida que duplicaria o e-mail.
concurrency:
  group: aviso-lixo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  avisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirmar_envio }}" != "ENVIAR" ]; then
            echo "Execucao manual sem confirmacao (digite ENVIAR no campo confirmar_envio) -> modo teste, nenhum e-mail sera enviado."
            python avisar_lixo.py --teste
          else
            python avisar_lixo.py
          fi

      - name: Registrar envio do dia (evita duplicidade)
        if: always()
        run: |
          if [ -n "$(git status --porcelain ultimo_envio.txt 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ultimo_envio.txt
            git commit -m "chore: registra envio de $(cat ultimo_envio.txt)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nada para registrar."
          fi
