name: Aviso Retirada de Lixo

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 6h horario de Brasilia (UTC-3), segunda a sexta
  workflow_dispatch:
    inputs:
      confirmar_envio:
        description: 'Digite ENVIAR para confirmar o envio real de e-mails (em branco = modo teste, nenhum e-mail e enviado)'
        required: false
        default: ''

jobs:
  avisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirmar_envio }}" != "ENVIAR" ]; then
            echo "Execucao manual sem confirmacao (digite ENVIAR no campo confirmar_envio) -> modo teste, nenhum e-mail sera enviado."
            python avisar_lixo.py --teste
          else
            python avisar_lixo.py
          fi
